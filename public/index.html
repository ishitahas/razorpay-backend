<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Razorpay Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; }
    input, button { padding: 10px; font-size: 16px; width: 100%; box-sizing: border-box; margin-top: 10px; }
    button { cursor: pointer; }
    #msg { margin-top: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <h2>Razorpay Payment Demo</h2>
  <label>Amount (INR)</label>
  <input id="amount" type="number" min="1" value="100" />
  <button id="pay">Pay Now</button>
  <p id="msg"></p>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const msg = document.getElementById("msg");

    document.getElementById("pay").onclick = async () => {
      msg.textContent = "";
      const res = await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: document.getElementById("amount").value }),
      });
      const { key_id, order, error } = await res.json();
      if (error) { msg.textContent = error; return; }

      const rzp = new Razorpay({
        key: key_id,
        amount: order.amount,
        currency: order.currency,
        name: "Demo Store",
        description: "Test payment",
        order_id: order.id,
        // Success handler -> verify signature on the backend
        handler: async (response) => {
          const v = await fetch("/api/payments/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(response), // razorpay_order_id, razorpay_payment_id, razorpay_signature
          });
          const data = await v.json();
          msg.textContent = data.success
            ? "Payment verified ✅ " + data.payment_id
            : "Verification failed ❌ " + data.error;
        },
        theme: { color: "#3399cc" },
      });
      rzp.on("payment.failed", (r) => (msg.textContent = "Payment failed: " + r.error.description));
      rzp.open();

      /* ALTERNATIVE (redirect flow): replace `handler` with
         callback_url: window.location.origin + "/api/payments/callback", redirect: true
         and Razorpay will POST the signature to that route. */
    };
  </script>
</body>
</html>
